<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar Asistencia</title>

  <!-- Bootstrap CSS CORRECTO -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <style>
    body {
      background: #f8f9fa;
    }

    .registro {
      border: 1px solid #dee2e6;
      border-radius: .5rem;
      padding: 1rem;
      background: #fff;
    }

    .registro+.registro {
      margin-top: 1rem;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container py-4">

    <h3 class="text-center mb-4">Evento - Confirmación de Asistencia</h3>

    <div class="d-flex justify-content-center">
      <button id="btnConfirmar" class="btn btn-primary btn-lg px-4">
        Confirmar Asistencia
      </button>
    </div>

    <!-- FORMULARIO OCULTO -->
    <div id="form-container" class="oculto mt-4">

      <form id="asistenciaForm">

        <div id="registros-container">

          <!-- REGISTRO 1 -->
          <div class="registro" data-index="1">
            <h5>Persona 1</h5>

            <div class="row g-3">

              <div class="col-12">
                <label>Nombre *</label>
                <input type="text" id="nombre-1" class="form-control" required>
              </div>

              <div class="col-12">
                <label>Apellido *</label>
                <input type="text" id="apellido-1" class="form-control" required>
              </div>

              <div class="col-12">
                <label>DNI *</label>
                <input type="text" id="dni-1" class="form-control" maxlength="9" required>
              </div>

              <div class="col-12">
                <label>Email *</label>
                <input type="email" id="email-1" class="form-control" required>
              </div>

              <div class="col-12">
                <label>Comentarios</label>
                <textarea id="comentarios-1" class="form-control"></textarea>
              </div>

              <!-- FECHA AUTOMÁTICA OCULTA -->
              <input type="hidden" id="fecha-1">
            </div>

          </div>

          <!-- REGISTROS 2–5 GENERADOS AUTOMÁTICAMENTE -->
          <script>
            for (let i = 2; i <= 5; i++) {
              document.write(`
              <div class="registro oculto" data-index="${i}">
                <h5>Persona ${i}</h5>
                <div class="row g-3">

                  <div class="col-12">
                    <label>Nombre *</label>
                    <input type="text" id="nombre-${i}" class="form-control">
                  </div>

                  <div class="col-12">
                    <label>Apellido *</label>
                    <input type="text" id="apellido-${i}" class="form-control">
                  </div>

                  <div class="col-12">
                    <label>DNI *</label>
                    <input type="text" id="dni-${i}" class="form-control" maxlength="9">
                  </div>

                  <div class="col-12">
                    <label>Email *</label>
                    <input type="email" id="email-${i}" class="form-control">
                  </div>

                  <div class="col-12">
                    <label>Comentarios</label>
                    <textarea id="comentarios-${i}" class="form-control"></textarea>
                  </div>

                  <input type="hidden" id="fecha-${i}">
                </div>
              </div>
              `);
            }
          </script>

        </div>

        <div class="d-flex gap-2 mt-3">
          <button type="button" id="btnAgregar" class="btn btn-outline-secondary flex-fill">
            Agregar otra persona
          </button>

          <button type="submit" class="btn btn-success flex-fill">
            ENVIAR
          </button>
        </div>

      </form>

      <div id="alerta" class="alert mt-3 d-none"></div>

    </div>

  </div>

  <!-- Bootstrap JS CORRECTO -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const WEBAPP_URL = "URL_DEL_WEBAPP"; // TU WebApp

    const btnConfirmar = document.getElementById("btnConfirmar");
    const formContainer = document.getElementById("form-container");
    const btnAgregar = document.getElementById("btnAgregar");
    const alerta = document.getElementById("alerta");

    // Mostrar formulario
    btnConfirmar.addEventListener("click", () => {
      formContainer.classList.remove("oculto");
      setFechaHoy();
    });

    // Agregar persona
    btnAgregar.addEventListener("click", () => {
      const ocultos = [...document.querySelectorAll(".registro.oculto")];
      if (ocultos.length > 0) ocultos[0].classList.remove("oculto");
    });

    function setFechaHoy() {
      const hoy = new Date().toISOString().split("T")[0];
      for (let i = 1; i <= 5; i++) {
        let campo = document.getElementById(`fecha-${i}`);
        if (campo) campo.value = hoy;
      }
    }

    // DNI solo números
    document.addEventListener("input", (e) => {
      if (e.target.id.startsWith("dni-")) {
        e.target.value = e.target.value.replace(/\D/g, "").substring(0, 9);
      }
    });

    // Enviar formulario
    document.getElementById("asistenciaForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const registros = [];

      for (let i = 1; i <= 5; i++) {
        const regDiv = document.querySelector(`.registro[data-index="${i}"]`);
        if (regDiv.classList.contains("oculto")) continue;

        const nombre = val(`nombre-${i}`);
        const apellido = val(`apellido-${i}`);
        const dni = val(`dni-${i}`);
        const email = val(`email-${i}`);
        const comentarios = val(`comentarios-${i}`);
        const fecha = val(`fecha-${i}`);

        if (!nombre && !apellido && !dni) continue;

        registros.push({ nombre, apellido, dni, email, comentarios, fecha });
      }

      await fetch(WEBAPP_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ registros })
      });

      alerta.className = "alert alert-success";
      alerta.textContent = "Datos enviados correctamente.";
      alerta.classList.remove("d-none");
    });

    function val(id) {
      return document.getElementById(id)?.value.trim() || "";
    }
  </script>

</body>
</html>
``
